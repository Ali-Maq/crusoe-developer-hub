name: Verify AYA repository analyst
on:
  push:
    paths: ["examples/cookbooks/repository-analyst/**", "specs/crusoe-repository-analyst.json", ".github/workflows/aya-repository-analyst.yml"]
  pull_request:
    paths: ["examples/cookbooks/repository-analyst/**", "specs/crusoe-repository-analyst.json", ".github/workflows/aya-repository-analyst.yml"]
permissions:
  contents: read
jobs:
  aya-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Contract and agent tests
        working-directory: examples/cookbooks/repository-analyst
        run: python -B -m unittest discover -s tests -v
